name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      # Tests never touch the network (tests/conftest.py), so they are safe on shared runners.
      - run: uv run --frozen pytest -q

  oldest:
    name: Tests with the oldest allowed dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      # The lower bounds in pyproject.toml are a promise: install exactly them and run the tests.
      - run: |
          uv venv .oldest
          uv pip install --python .oldest --resolution lowest-direct -e . "pytest>=9.2.0"
          .oldest/bin/python -m pytest -q

  package:
    name: Package builds and ships the remote page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - name: Wheel contains the page, the example config, the dictionaries and the app catalog
        run: |
          unzip -l dist/*.whl | grep -q "tvpult/static/index.html"
          unzip -l dist/*.whl | grep -q "tvpult/devices.example.toml"
          unzip -l dist/*.whl | grep -q "tvpult/locales/en.json"
          unzip -l dist/*.whl | grep -q "tvpult/locales/ru.json"
          unzip -l dist/*.whl | grep -q "tvpult/apps.json"
      # The built wheel in a clean environment, not the source tree: catches a missing data file or dependency.
      - name: The wheel installs and runs
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/tvpult --version
          /tmp/wheel-check/bin/tvpult catalog
          /tmp/wheel-check/bin/tvpult keys
