name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # Tests never touch the network (tests/conftest.py), so they are safe on shared runners.
      - run: uv run --frozen pytest -q

  oldest:
    name: Tests with the oldest allowed dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # The lower bounds in pyproject.toml are a promise: install exactly them and run the tests.
      - run: |
          uv venv .oldest
          uv pip install --python .oldest --resolution lowest-direct -e . "pytest>=9.2.0"
          .oldest/bin/python -m pytest -q

  package:
    name: Package builds and ships the remote page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      # The page, the example config, the dictionaries and the app catalog are in the wheel, and it installs
      # and runs in a clean environment.
      - run: sh scripts/check-wheel.sh

  install:
    name: uv tool install and the shortcut (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      TVPULT_LANG: en # the shortcut's name follows the system language; the checks below expect "TV Remote"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      # What a user does after the release (`uv tool install tvpult`), from the built wheel instead of PyPI.
      - name: uv tool install
        run: |
          uv tool install --python 3.12 "$(ls dist/*.whl)"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: tvpult shortcut
        run: |
          cd "$RUNNER_TEMP"
          tvpult --version
          tvpult paths
          tvpult shortcut
      - name: The shortcut is there and points at the installed tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'TV Remote.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          "$($s.TargetPath) $($s.Arguments)"
          if ($s.TargetPath -notlike '*pythonw.exe' -or -not (Test-Path $s.TargetPath)) { throw 'no pythonw target' }
          if ($s.Arguments -ne '-m tvpult app') { throw "arguments: $($s.Arguments)" }
          & ($s.TargetPath -replace 'pythonw.exe$', 'python.exe') -c 'import tvpult; print(tvpult.__file__)'
      - name: The menu entry is valid and points at the installed tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          entry="$HOME/.local/share/applications/tvpult.desktop"
          cat "$entry"
          desktop-file-validate "$entry"
          test -x "$entry"
          grep -q "^Exec=.*$(uv tool dir)/tvpult/bin/python" "$entry"
      - name: The app bundle is valid and points at the installed tool
        if: runner.os == 'macOS'
        run: |
          app="$HOME/Applications/TV Remote.app"
          plutil -lint "$app/Contents/Info.plist"
          cat "$app/Contents/MacOS/tvpult"
          sh -n "$app/Contents/MacOS/tvpult"
          test -x "$app/Contents/MacOS/tvpult"
          test -s "$app/Contents/Resources/tvpult.icns"
          grep -q "$(uv tool dir)/tvpult/bin/python" "$app/Contents/MacOS/tvpult"
