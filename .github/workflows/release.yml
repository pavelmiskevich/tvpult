name: Release

# Push a tag `vX.Y.Z` (the version in pyproject.toml, with a CHANGELOG.md section for it) and this builds the
# package, checks it, publishes it on PyPI and makes the GitHub release. PyPI trusts this workflow through
# Trusted Publishing: no token is stored anywhere. How to cut a release: docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag is the version in pyproject.toml
        id: version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has a section for it
        run: sh scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: sh scripts/check-wheel.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-latest
    # The PyPI side names this environment; in the repository settings it can require the owner's approval.
    environment:
      name: pypi
      url: https://pypi.org/project/tvpult/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: a short-lived OIDC token instead of a stored password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    name: GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release with the CHANGELOG section and the built files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sh scripts/release-notes.sh "$VERSION" > notes.md
          # 0.1.0rc1, 0.2.0b1, 0.1.0.dev1: a pre-release, not "Latest"
          case "$VERSION" in *a*|*b*|*rc*|*dev*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "tvpult $VERSION" --notes-file notes.md --verify-tag $pre
