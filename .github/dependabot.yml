# Keeps the pinned GitHub Actions (by commit hash) and uv.lock from only ageing. Monthly, grouped: one pull
# request per ecosystem, which CI then checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
