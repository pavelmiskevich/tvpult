<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='13' rx='2' fill='%232f6df6'/%3E%3Cpath d='M8 21h8' stroke='%232f6df6' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f4f7; --panel: #ffffff; --btn: #e9ebf0; --btn-press: #d6d9e1;
    --text: #15171c; --muted: #6b7180; --accent: #2f6df6; --accent-text: #fff;
    --danger: #e5484d; --ok: #2e9e5b; --ring: rgba(47,109,246,.35);
    --radius: 18px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f13; --panel: #171a21; --btn: #222631; --btn-press: #2d3240;
      --text: #eef0f5; --muted: #8b92a3; --accent: #4f86ff; --ring: rgba(79,134,255,.4);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  main > * { min-width: 0; }  /* never wider than the screen, whatever the content */

  .tabs { display: flex; gap: 6px; background: var(--panel); padding: 5px; border-radius: 14px; box-shadow: var(--shadow); }
  .tab.add { flex: 0 0 auto; padding: 10px 12px; color: var(--accent); }
  .setup-title { font-size: 20px; margin: 0 0 6px; }
  .setup-msg { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
  .setup-list { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .cand { border: 1px solid var(--btn-press); border-radius: 14px; padding: 12px; display: grid; gap: 8px;
    grid-template-columns: minmax(0, 1fr); }
  .cand > * { min-width: 0; overflow-wrap: anywhere; }
  .cand h2 { font-size: 16px; margin: 0; }
  .cand .meta { color: var(--muted); font-size: 13px; }
  .cand .row { display: flex; gap: 8px; }
  .cand input { flex: 1; min-width: 0; min-height: 48px; border-radius: 12px; border: 1px solid var(--btn-press);
    background: var(--bg); color: var(--text); font: inherit; padding: 0 12px; }
  .cand .note { font-size: 13px; color: var(--danger); }
  .cand .ok { font-size: 14px; color: var(--ok); font-weight: 600; }
  .cand .wait { font-size: 14px; color: var(--accent); }
  .cand .row button.b { padding: 0 14px; flex: none; }
  .cand .row.wrap { flex-wrap: wrap; }
  .cand .row.wrap button.b { flex: 1 1 auto; min-height: 44px; font-size: 15px; }
  .cand .check { margin-top: 0; }
  .cand .check input { flex: none; min-height: 0; width: 20px; height: 20px; margin: 0; padding: 0; }
  button.b.danger { background: var(--danger); color: #fff; }
  .qlist { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
  .qrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .qrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .qrow button.b { min-height: 40px; width: 44px; flex: none; }
  .tab.gear { flex: 0 0 auto; padding: 10px 12px; }
  .lang-select { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--btn-press);
    background: var(--bg); color: var(--text); font: inherit; padding: 0 10px; margin-top: 4px; }
  .setup-actions { display: flex; gap: 8px; margin-top: 14px; }
  .setup-actions .b { flex: 1; }
  button.b.primary { background: var(--accent); color: var(--accent-text); }
  .pin-input { width: 100%; min-height: 64px; border-radius: 14px; border: 1px solid var(--btn-press);
    background: var(--bg); color: var(--text); font: 600 32px/1 ui-monospace, monospace; letter-spacing: .3em;
    text-align: center; }
  .pin-input:focus { outline: 3px solid var(--ring); outline-offset: 1px; }
  .pin-msg { min-height: 1.4em; margin: 10px 0 0; color: var(--danger); font-size: 14px; }
  details.phone summary { cursor: pointer; font-weight: 600; list-style-position: inside; }
  .phone-body { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; align-items: center; }
  .phone-body img { background: #fff; border-radius: 10px; flex: none; }
  .phone-info { flex: 1; min-width: 160px; }
  .phone-info p { margin: 0 0 4px; }
  .lan-url { font-weight: 600; overflow-wrap: anywhere; margin-bottom: 10px !important; }
  .lan-pin { font: 700 30px/1.2 ui-monospace, monospace; letter-spacing: .15em; margin-bottom: 10px !important; }
  .sessions { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
  .sess { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 14px;
    min-width: 0; }
  .sess span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sess button.b { min-height: 36px; padding: 0 12px; font-size: 14px; flex: none; }
  .tab { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px 6px; border-radius: 10px;
    font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab[aria-selected="true"] { background: var(--btn); color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .5; flex: none; }
  .dot.on { background: var(--ok); opacity: 1; }
  .dot.standby { background: #d9a400; opacity: 1; }

  .card { background: var(--panel); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .head { display: flex; align-items: center; gap: 12px; }
  .head .info { flex: 1; min-width: 0; }
  .head h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button.b { border: 0; background: var(--btn); color: var(--text); border-radius: 14px; font: inherit; font-weight: 600;
    min-height: 52px; cursor: pointer; display: grid; place-items: center; user-select: none; touch-action: manipulation;
    transition: background .1s, transform .05s; }
  button.b:active, button.b.pressed { background: var(--btn-press); transform: scale(.97); }
  button.b:focus-visible, .tab:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  button.b:disabled { opacity: .4; cursor: default; }
  button.power { width: 52px; height: 52px; min-height: 0; border-radius: 50%; background: var(--danger); color: #fff; flex: none; }
  button.power.off { background: var(--btn); color: var(--text); }
  svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 64px); gap: 8px; }
  .pad .ok { background: var(--accent); color: var(--accent-text); border-radius: 50%;
    height: 100%; aspect-ratio: 1; justify-self: center; }
  .tab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rockers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rocker { display: grid; grid-template-rows: 52px 28px 52px; gap: 0; background: var(--btn); border-radius: 16px; overflow: hidden; }
  .rocker button.b { border-radius: 0; background: transparent; }
  .rocker span { text-align: center; color: var(--muted); font-size: 13px; align-self: center; }
  .label { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .apps button.b { padding: 0 10px; font-size: 15px; }
  .apps button.current { outline: 2px solid var(--accent); }
  .empty { color: var(--muted); font-size: 14px; }
  .textrow { display: flex; gap: 8px; }
  .textrow input { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; border: 1px solid var(--btn-press);
    background: var(--bg); color: var(--text); font: inherit; padding: 0 14px; }
  .textrow input:focus { outline: 3px solid var(--ring); outline-offset: 1px; }
  .textrow button.b { padding: 0 18px; background: var(--accent); color: var(--accent-text); }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .quick:empty { display: none; }
  .quick button.b { min-height: 56px; background: var(--panel); box-shadow: var(--shadow); padding: 0 8px;
    font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick button.b.current { outline: 2px solid var(--accent); }
  .quick button.b.missing { opacity: .45; font-weight: 500; }

  .vol { display: flex; align-items: center; gap: 12px; }
  .vol output { min-width: 3ch; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 32px; }

  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
    transition: transform .2s, opacity .2s; pointer-events: none; opacity: 0; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav class="tabs" role="tablist" id="tabs"><span class="tab" data-i18n="loading">Loading…</span></nav>

  <!-- Setup wizard: shown when nothing is configured, or from the "+ ТВ" tab -->
  <section id="setup" hidden>
    <div class="card">
      <h1 class="setup-title" data-i18n="setup.title"></h1>
      <p class="setup-msg" id="setupMsg" data-i18n="setup.intro"></p>
      <div class="setup-list" id="setupList"></div>
      <div class="setup-actions">
        <button class="b" id="setupScan" data-i18n="search_again"></button>
        <button class="b primary" id="setupDone" hidden data-i18n="done"></button>
      </div>
    </div>
  </section>

  <!-- Settings: devices, names, quick apps, unpairing (from the "⚙" tab) -->
  <section id="settings" hidden>
    <div class="card">
      <h1 class="setup-title" data-i18n="settings"></h1>
      <p class="label" data-i18n="set.devices"></p>
      <div class="setup-list" id="setDevices"></div>
      <div class="setup-actions">
        <button class="b" id="setSearch" data-i18n="search_again"></button>
        <button class="b" id="setAdd" data-i18n="set.add_tv"></button>
      </div>
      <p class="setup-msg" id="setSearchMsg" role="status" style="margin:10px 0 0"></p>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="label" data-i18n="set.quick"></p>
      <p class="setup-msg" data-i18n="set.quick_hint"></p>
      <div class="qlist" id="setQuick"></div>
      <p class="label" style="margin-top:14px" data-i18n="set.add"></p>
      <div class="apps" id="setQuickAdd"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <label class="label" for="setLang" data-i18n="set.language"></label>
      <select id="setLang" class="lang-select">
        <option value="" data-i18n="lang.auto"></option>
        <option value="en" lang="en">English</option>
        <option value="ru" lang="ru">Русский</option>
      </select>
    </div>
  </section>

  <!-- TV -->
  <section id="tv" hidden>
    <div class="card head">
      <div class="info"><h1 id="tvName">—</h1><p id="tvState">…</p></div>
      <button class="b power" id="power" data-i18n-aria="key.power">
        <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>

    <div class="quick" id="quick" style="margin-top:14px"></div>

    <div class="card" style="margin-top:14px">
      <div class="pad">
        <button class="b" data-key="KEY_MENU" data-i18n-aria="key.menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button class="b" data-key="KEY_UP" data-i18n-aria="key.up"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="b" data-key="KEY_SOURCE" data-i18n-aria="key.source"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m10 10 3 2-3 2"/></svg></button>
        <button class="b" data-key="KEY_LEFT" data-i18n-aria="key.left"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="b ok" data-key="KEY_ENTER" aria-label="OK">OK</button>
        <button class="b" data-key="KEY_RIGHT" data-i18n-aria="key.right"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="b" data-key="KEY_RETURN" data-i18n-aria="key.back"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="b" data-key="KEY_DOWN" data-i18n-aria="key.down"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="b" data-key="KEY_HOME" data-i18n-aria="key.home"><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
      </div>
      <div class="row4" style="margin-top:8px">
        <button class="b" data-key="KEY_REWIND" data-i18n-aria="key.rewind"><svg viewBox="0 0 24 24"><path d="m11 18-7-6 7-6zM20 18l-7-6 7-6z"/></svg></button>
        <button class="b" data-key="KEY_PLAY" data-i18n-aria="key.play"><svg viewBox="0 0 24 24"><path d="m7 5 12 7-12 7z"/></svg></button>
        <button class="b" data-key="KEY_PAUSE" data-i18n-aria="key.pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
        <button class="b" data-key="KEY_FF" data-i18n-aria="key.ff"><svg viewBox="0 0 24 24"><path d="m13 18 7-6-7-6zM4 18l7-6-7-6z"/></svg></button>
      </div>
    </div>

    <div class="rockers" style="margin-top:14px">
      <div class="rocker">
        <button class="b" data-key="KEY_VOLUP" data-repeat data-i18n-aria="key.volup">+</button>
        <span data-i18n="vol.short"></span>
        <button class="b" data-key="KEY_VOLDOWN" data-repeat data-i18n-aria="key.voldown">−</button>
      </div>
      <div class="rocker">
        <button class="b" data-key="KEY_CHUP" data-i18n-aria="key.chup"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <span data-i18n="ch.short"></span>
        <button class="b" data-key="KEY_CHDOWN" data-i18n-aria="key.chdown"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>
    <div class="row3">
      <button class="b" data-key="KEY_MUTE" data-i18n="key.mute"></button>
      <button class="b" data-key="KEY_INFO" data-i18n="key.info"></button>
      <button class="b" data-key="KEY_EXIT" data-i18n="key.exit"></button>
    </div>

    <form class="card" id="textForm" style="margin-top:14px" autocomplete="off">
      <p class="label" data-i18n="text.title"></p>
      <div class="textrow">
        <input id="textIn" type="text" maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false"
               data-i18n-ph="text.placeholder" data-i18n-aria="text.aria">
        <button class="b" type="submit" id="textSend" data-i18n="text.send"></button>
      </div>
      <label class="check"><input type="checkbox" id="textSubmit" checked> <span data-i18n="text.submit"></span></label>
    </form>

    <div class="card" style="margin-top:14px">
      <p class="label" data-i18n="apps"></p>
      <div class="apps" id="apps"></div>
    </div>
  </section>

  <!-- Soundbar -->
  <section id="bar" hidden>
    <div class="card head">
      <div class="info"><h1 id="barName">—</h1><p id="barState">…</p></div>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="label" data-i18n="bar.volume"></p>
      <div class="vol">
        <button class="b" id="barDown" style="width:52px" data-i18n-aria="key.voldown">−</button>
        <input type="range" id="barVol" min="0" max="100" step="1" data-i18n-aria="bar.volume">
        <button class="b" id="barUp" style="width:52px" data-i18n-aria="key.volup">+</button>
        <output id="barVolOut">–</output>
      </div>
      <button class="b" id="barMute" style="width:100%;margin-top:12px"></button>
    </div>
  </section>

  <!-- Phone on the home network: PIN sign-in (shown only when the server asks for it) -->
  <section id="pin" hidden>
    <form class="card" id="pinForm" autocomplete="off">
      <h1 class="setup-title" data-i18n="pin.title"></h1>
      <p class="setup-msg" data-i18n="pin.intro"></p>
      <input id="pinIn" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" aria-label="PIN" placeholder="••••••">
      <button class="b primary" type="submit" id="pinGo" style="width:100%;margin-top:12px" data-i18n="pin.go"></button>
      <p class="pin-msg" id="pinMsg" role="status"></p>
    </form>
  </section>

  <!-- On this computer only: how to open the remote on a phone -->
  <details class="card phone" id="phone" hidden>
    <summary data-i18n="phone.summary"></summary>
    <div class="phone-body">
      <img id="lanQr" data-i18n-alt="phone.qr_alt" width="180" height="180">
      <div class="phone-info">
        <p class="setup-msg" data-i18n="phone.scan"></p>
        <p class="lan-url" id="lanUrl"></p>
        <p class="setup-msg" data-i18n="phone.pin"></p>
        <p class="lan-pin" id="lanPin"></p>
        <button class="b" id="lanNewPin" type="button" data-i18n="phone.new_pin"></button>
      </div>
    </div>
    <p class="label" style="margin-top:12px" data-i18n="phone.sessions"></p>
    <div id="lanSessions" class="sessions"></div>
  </details>

  <p class="hint" id="hint" data-i18n="hint"></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { devices: [], quick: [], sel: null, busy: false, setupOpen: false, setupAuto: true, needPin: false,
  settingsOpen: false, settingsDirty: false, armed: null, setMsg: {} };
try { state.sel = localStorage.getItem("tvpult.sel"); } catch (_) {}

// --- languages: English and Russian; the server embeds both dictionaries here ---------------------
const I18N = /*TVPULT_I18N*/null;
const LANG_KEY = "tvpult.lang";  // "", "en" or "ru": the switch in the settings ("" = as in the browser)
function langChoice() { try { return localStorage.getItem(LANG_KEY) || ""; } catch (_) { return ""; } }
function pickLang() {
  const choice = langChoice();
  if (choice === "en" || choice === "ru") return choice;
  for (const l of navigator.languages || [navigator.language || ""]) {
    const p = String(l).toLowerCase().slice(0, 2);
    if (p === "ru" || p === "en") return p;
  }
  return "en";
}
let LANG = pickLang();
// t("key", {name: "x"}): the text in the page's language, {placeholders} filled in (values are never re-read).
function t(key, vars) {
  const dict = (I18N && I18N[LANG]) || {}, en = (I18N && I18N.en) || {};
  const text = dict[key] ?? en[key] ?? key;
  return vars ? text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : text;
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((n) => (n.textContent = t(n.dataset.i18n)));
  document.querySelectorAll("[data-i18n-aria]").forEach((n) => n.setAttribute("aria-label", t(n.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-ph]").forEach((n) => (n.placeholder = t(n.dataset.i18nPh)));
  document.querySelectorAll("[data-i18n-alt]").forEach((n) => (n.alt = t(n.dataset.i18nAlt)));
  $("setLang").value = langChoice();
}
applyLang();
$("setLang").onchange = () => {
  try { localStorage.setItem(LANG_KEY, $("setLang").value); } catch (_) {}
  LANG = pickLang(); applyLang();
  state.settingsDirty = true; render(); loadLan();
};
const APP_KEYS = new Set(I18N ? Object.keys(I18N.en).filter((k) => k.startsWith("app.")).map((k) => k.slice(4)) : []);
// Known services get a fixed name per language; anything else: the name the TV reports.
const appName = (alias, fallback) => (APP_KEYS.has(alias) ? t("app." + alias) : fallback || alias);
const POWER = { "already on": "power.already_on", "woken from standby": "power.woken",
  "wake-on-lan sent": "power.wol_sent", "already off": "power.already_off", "turned off": "power.turned_off" };

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Tvpult": "1" }, body: JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && data.error === "pin_required") {  // a phone on the home network, not signed in yet
    if (!state.needPin) { state.needPin = true; render(); }
    const e = new Error(t("pin.needed")); e.pin = true; throw e;
  }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// --- PIN sign-in (phones on the home network) ------------------------------------------
$("pinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = $("pinIn").value.replace(/\D/g, "");
  if (pin.length !== 6) { $("pinMsg").textContent = t("pin.six"); return; }
  $("pinGo").disabled = true; $("pinMsg").textContent = "";
  try {
    await api("/api/login", { pin });
    state.needPin = false; $("pinIn").value = "";
    hello(); refresh();
  } catch (err) {
    $("pinMsg").textContent = err.message === "wrong PIN" ? t("pin.wrong") :
      err.message.startsWith("too many") ? t("pin.locked") : err.message;
  } finally {
    $("pinGo").disabled = false;
  }
});

// --- On this computer: PIN, address and QR for phones (the server answers only here) -------
async function loadLan() {
  let info;
  try {
    const r = await fetch("/api/lan");
    if (!r.ok) { $("phone").hidden = true; return; }
    info = await r.json();
  } catch (_) { return; }
  $("phone").hidden = !info.enabled;
  if (!info.enabled) return;
  $("lanQr").src = info.qr; $("lanUrl").textContent = info.url; $("lanPin").textContent = info.pin;
  const list = $("lanSessions");
  if (!info.sessions.length) { list.replaceChildren(el("span", "setup-msg", t("phone.none"))); return; }
  list.replaceChildren(...info.sessions.map((s) => {
    const row = el("div", "sess");
    const when = new Date(s.created * 1000).toLocaleDateString(LANG);
    row.append(el("span", null, (s.label || t("phone.default")) + " · " + when));
    const b = el("button", "b", t("phone.revoke"));
    b.onclick = () => act(() => api("/api/lan/revoke", { id: s.id }).then(loadLan), t("phone.revoked"), { refreshAfter: 0 });
    row.append(b);
    return row;
  }));
}
$("lanNewPin").onclick = () => act(() => api("/api/lan/pin", {}).then(loadLan), t("phone.new_pin"), { refreshAfter: 0 });

let toastTimer;
function toast(msg) {
  const box = $("toast"); box.textContent = msg; box.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => box.classList.remove("show"), 2600);
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} };
const current = () => state.devices.find((d) => d.id === state.sel);

function powerClass(d) {
  if (d.kind === "soundbar") return d.online ? "on" : "";
  if (!d.online) return "";
  return d.power === "on" ? "on" : "standby";
}

function renderTabs() {
  const nav = $("tabs");
  const tabs = state.devices.map((d) => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab";
    b.setAttribute("aria-selected", String(d.id === state.sel && !state.setupOpen && !state.settingsOpen));
    const dot = document.createElement("span"); dot.className = "dot " + powerClass(d);
    b.append(dot, document.createTextNode(d.name));
    b.onclick = () => {
      state.sel = d.id; state.setupOpen = false; state.settingsOpen = false;
      try { localStorage.setItem("tvpult.sel", d.id); } catch (_) {}
      render();
    };
    return b;
  });
  const add = document.createElement("button");
  add.className = "tab add"; add.textContent = t("tab.add"); add.title = t("tab.add_title");
  add.setAttribute("aria-selected", String(state.setupOpen));
  add.onclick = () => openSetup();
  const gear = document.createElement("button");
  gear.className = "tab gear"; gear.textContent = "⚙"; gear.title = t("settings");
  gear.setAttribute("aria-label", t("settings")); gear.setAttribute("aria-selected", String(state.settingsOpen));
  gear.onclick = () => openSettings();
  nav.replaceChildren(...tabs, add, gear);
}

// --- settings -------------------------------------------------------------------------

function openSettings() {
  state.settingsOpen = true; state.setupOpen = false; state.settingsDirty = true;
  $("setSearchMsg").textContent = "";
  render();
}

function appLabel(alias) {
  for (const d of state.devices) for (const a of d.apps || []) if (a.alias === alias) return appName(alias, a.name);
  return appName(alias);
}

// Run a settings change, then show the new state at once (and re-read it from the server).
async function settingsAct(fn, okMsg) {
  buzz();
  try {
    const r = await fn();
    if (r && Array.isArray(r.quick)) state.quick = r.quick;
    if (okMsg) toast(okMsg);
  } catch (e) { toast(e.message); }
  state.settingsDirty = true;
  render();
  refresh();
}

function renderSettings() {
  state.settingsDirty = false;
  $("setDevices").replaceChildren(...(state.devices.length
    ? state.devices.map(deviceCard) : [el("p", "setup-msg", t("set.no_devices"))]));
  renderQuickSettings();
}

function deviceCard(d) {
  const card = el("div", "cand");
  card.append(el("h2", null, d.name));
  const meta = [t("kind." + d.kind), d.model, d.host];
  if (d.kind === "tv") meta.push(d.paired ? t("paired") : t("not_paired"));
  card.append(el("div", "meta", meta.filter(Boolean).join(" · ")));

  const msg = el("div", "wait");
  // kept across re-renders until the next action on this device; stored as a key, so a language switch applies
  const say = (cls, key, vars) => {
    state.setMsg[d.id] = key ? { cls, key, vars } : undefined;
    msg.className = cls || "wait"; msg.textContent = key ? t(key, vars) : ""; msg.hidden = !key;
  };
  const old = state.setMsg[d.id];
  if (old) say(old.cls, old.key, old.vars); else say();

  const row = el("div", "row");
  const input = el("input");
  input.type = "text"; input.maxLength = 40; input.value = d.name;
  input.setAttribute("aria-label", t("name_aria", { name: d.name }));
  const save = el("button", "b", t("save"));
  save.disabled = true;
  input.oninput = () => { save.disabled = !input.value.trim() || input.value.trim() === d.name; };
  const doSave = () => { say(); settingsAct(() => api("/api/settings/device",
    { kind: d.kind, id: d.id, name: input.value.trim() }), t("name_saved")); };
  save.onclick = doSave;
  input.onkeydown = (e) => { if (e.key === "Enter" && !save.disabled) doSave(); };
  row.append(input, save);
  card.append(row);

  if (d.kind === "tv") {
    const lab = el("label", "check");
    const cb = el("input");
    cb.type = "checkbox"; cb.checked = !!d.wake_on_lan; cb.disabled = !d.has_mac && !d.wake_on_lan;
    lab.title = d.has_mac ? t("wol.need_setting") : t("wol.no_mac");
    cb.onchange = () => { say(); settingsAct(() => api("/api/settings/device",
      { kind: "tv", id: d.id, wake_on_lan: cb.checked }),
      cb.checked ? t("wol.on") : t("wol.off")); };
    lab.append(cb, document.createTextNode(t("wol.label")));
    card.append(lab);
  }

  const acts = el("div", "row wrap");
  if (d.kind === "tv") {
    const pair = el("button", "b", d.paired ? t("pair.again") : t("pair.connect"));
    pair.onclick = async () => {
      buzz(); pair.disabled = true;
      say("wait", "pair.look_maybe");
      try { await api("/api/settings/pair", { kind: "tv", id: d.id }); say("ok", "pair.ok"); }
      catch (e) { say("note", "pair.failed", { error: e.message }); }
      state.settingsDirty = true; refresh();
    };
    acts.append(pair);
    if (d.paired) {
      const unpair = el("button", "b", t("unpair"));
      unpair.onclick = async () => {
        buzz();
        try { await api("/api/settings/unpair", { kind: "tv", id: d.id }); say("wait", "unpair.hint"); }
        catch (e) { say("note", "pair.failed", { error: e.message }); }
        state.settingsDirty = true; refresh();
      };
      acts.append(unpair);
    }
  }
  const armed = state.armed === d.id;
  const del = el("button", "b" + (armed ? " danger" : ""), armed ? t("del.sure") : t("del"));
  del.onclick = () => {
    if (!armed) {  // two taps instead of a dialog: the first one only asks
      state.armed = d.id; state.settingsDirty = true; render();
      setTimeout(() => { if (state.armed === d.id) { state.armed = null; state.settingsDirty = true; render(); } }, 4000);
      return;
    }
    state.armed = null; delete state.setMsg[d.id];
    settingsAct(() => api("/api/settings/remove", { kind: d.kind, id: d.id }), t("del.done", { name: d.name }));
  };
  acts.append(del);
  card.append(acts, msg);
  return card;
}

function renderQuickSettings() {
  const chosen = state.quick;
  const save = (apps) => settingsAct(() => api("/api/settings/quick", { apps }));
  const move = (i, j) => { const a = [...chosen]; [a[i], a[j]] = [a[j], a[i]]; save(a); };
  const small = (text, label, fn, disabled) => {
    const b = el("button", "b", text);
    b.setAttribute("aria-label", label); b.disabled = !!disabled; b.onclick = fn;
    return b;
  };
  $("setQuick").replaceChildren(...(chosen.length ? chosen.map((alias, i) => {
    const row = el("div", "qrow");
    const name = appLabel(alias);
    row.append(el("span", null, name),
      small("↑", t("quick.up", { name }), () => move(i, i - 1), i === 0),
      small("↓", t("quick.down", { name }), () => move(i, i + 1), i === chosen.length - 1),
      small("✕", t("quick.remove", { name }), () => save(chosen.filter((a) => a !== alias))));
    return row;
  }) : [el("p", "setup-msg", t("quick.empty"))]));
  const avail = new Map();
  for (const d of state.devices) {
    for (const a of d.apps || []) if (!chosen.includes(a.alias) && !avail.has(a.alias)) avail.set(a.alias, appLabel(a.alias));
  }
  $("setQuickAdd").replaceChildren(...(avail.size ? [...avail].map(([alias, name]) => {
    const b = el("button", "b", "+ " + name);
    b.disabled = chosen.length >= 12;
    b.onclick = () => save([...chosen, alias]);
    return b;
  }) : [el("p", "setup-msg", t("quick.no_apps"))]));
}

$("setAdd").onclick = () => openSetup();
$("setSearch").onclick = async () => {
  const btn = $("setSearch"), msg = $("setSearchMsg");
  btn.disabled = true; msg.textContent = t("search.running");
  try {
    const r = await api("/api/settings/search", {});
    const n = Object.keys(r.found).length;
    msg.textContent = r.recent ? t("search.recent")
      : n ? t("search.found", { n, total: state.devices.length }) : t("search.none");
  } catch (e) { msg.textContent = t("search.failed", { error: e.message }); }
  btn.disabled = false;
  state.settingsDirty = true; refresh();
};

// --- setup wizard ---------------------------------------------------------------------
function openSetup() {
  state.setupOpen = true; state.settingsOpen = false;
  render();
  scanTvs();
}

async function scanTvs() {
  const list = $("setupList"), msg = $("setupMsg"), btn = $("setupScan");
  btn.disabled = true;
  msg.textContent = t("setup.searching");
  list.replaceChildren();
  try {
    const { tvs } = await api("/api/setup/scan", {});
    if (!tvs.length) {
      msg.textContent = t("setup.none");
    } else {
      msg.textContent = t("setup.found", { n: tvs.length });
      list.replaceChildren(...tvs.map(candidateCard));
    }
  } catch (e) {
    msg.textContent = t("search.failed", { error: e.message });
  } finally {
    btn.disabled = false;
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // always text: names come from the network
  return n;
}

function candidateCard(tv) {
  const card = el("div", "cand");
  card.append(el("h2", null, tv.name || tv.model || "Samsung TV"));
  card.append(el("div", "meta", [tv.model, tv.year, tv.host].filter(Boolean).join(" · ")));
  if (tv.configured) { card.append(el("div", "ok", t("setup.already"))); return card; }
  if (!tv.confirmed) { card.append(el("div", "note", tv.note || t("setup.unconfirmed"))); return card; }
  const row = el("div", "row");
  const input = el("input");
  input.type = "text"; input.maxLength = 40; input.value = ""; input.placeholder = t("setup.name_ph");
  input.setAttribute("aria-label", t("setup.name_aria"));
  const go = el("button", "b primary", t("pair.connect"));
  const status = el("div", "wait");
  status.hidden = true;
  go.onclick = async () => {
    go.disabled = true; input.disabled = true;
    status.hidden = false; status.className = "wait";
    status.textContent = t("pair.look");
    try {
      await api("/api/setup/pair", { cid: tv.cid, name: input.value.trim() || tv.model || t("tv.default") });
      status.className = "ok"; status.textContent = t("pair.ok");
      row.remove();
      $("setupDone").hidden = false;
      refreshSoon(300);
    } catch (e) {
      status.className = "note"; status.textContent = t("pair.failed", { error: e.message });
      go.disabled = false; input.disabled = false;
    }
  };
  row.append(input, go);
  card.append(row, status);
  return card;
}

$("setupScan").onclick = () => scanTvs();
$("setupDone").onclick = () => { state.setupOpen = false; $("setupDone").hidden = true; refresh(); };

function renderTv(d) {
  $("tvName").textContent = d.name;
  let s;
  if (!d.online) s = d.wake_on_lan ? t("tv.off_wol") : t("tv.off");
  else if (d.power !== "on") s = t("tv.standby");
  else s = d.current_app ? t("tv.on_screen", { app: d.current_app }) : (d.model || t("tv.on"));
  if (d.online && (d.wired || d.network)) s += " · " + (d.wired ? t("tv.cable") : d.network);
  if (d.online && !d.paired) s += " · " + t("tv.not_paired");
  $("tvState").textContent = s;
  const on = d.online && d.power === "on";
  $("power").classList.toggle("off", !on);
  $("power").disabled = !on && !d.wake_on_lan && !d.online;
  document.querySelectorAll("#tv [data-key]").forEach((b) => (b.disabled = !on));
  ["textIn", "textSend"].forEach((id) => ($(id).disabled = !on));
  renderQuick(d, on);
  const apps = $("apps");
  if (!on) { apps.replaceChildren(el("span", "empty", t("tv.is_off"))); return; }
  const rest = (d.apps || []).filter((a) => !state.quick.includes(a.alias));
  apps.closest(".card").hidden = !rest.length && on;
  if (!rest.length) { apps.replaceChildren(el("span", "empty", t("tv.no_more_apps"))); return; }
  apps.replaceChildren(...rest.map((a) => {
    const b = document.createElement("button");
    b.className = "b" + (a.name === d.current_app ? " current" : ""); b.textContent = appName(a.alias, a.name);
    b.onclick = () => act(() => api(`/api/tv/${d.id}/launch`, { app: a.alias }), t("app.opening", { name: b.textContent }));
    return b;
  }));
}

function renderQuick(d, on) {
  const installed = Object.fromEntries((d.apps || []).map((a) => [a.alias, a]));
  $("quick").replaceChildren(...state.quick.map((alias) => {
    const a = installed[alias];
    const b = document.createElement("button");
    b.className = "b" + (a && a.name === d.current_app ? " current" : "") + (on && !a ? " missing" : "");
    b.textContent = appName(alias, a && a.name);
    b.disabled = !on;
    if (on && !a) b.title = t("app.missing_title");
    b.onclick = () => a
      ? act(() => api(`/api/tv/${d.id}/launch`, { app: alias }), t("app.opening", { name: b.textContent }))
      : toast(t("app.missing", { name: b.textContent }));
    return b;
  }));
}

let dragging = false;
function renderBar(d) {
  $("barName").textContent = d.name;
  $("barState").textContent = !d.online ? t("bar.offline") : (d.app ? t("bar.playing", { app: d.app }) : t("bar.online"));
  if (!dragging && typeof d.volume === "number") { $("barVol").value = d.volume; $("barVolOut").textContent = d.volume; }
  $("barMute").textContent = d.muted ? t("bar.unmute") : t("bar.mute");
  ["barVol", "barUp", "barDown", "barMute"].forEach((id) => ($(id).disabled = !d.online));
}

function render() {
  if (!current() && state.devices.length) state.sel = state.devices[0].id;
  $("pin").hidden = !state.needPin;
  $("tabs").hidden = state.needPin;
  if (state.needPin) {  // nothing else until signed in
    ["setup", "settings", "tv", "bar", "hint"].forEach((id) => ($(id).hidden = true));
    setTimeout(() => $("pinIn").focus(), 0);
    return;
  }
  renderTabs();
  $("setup").hidden = !state.setupOpen;
  $("settings").hidden = !state.settingsOpen;
  // Rebuilt after its own changes, and by the 5 s refresh only while nothing in it has focus
  // (so a name being typed isn't wiped).
  if (state.settingsOpen && (state.settingsDirty || !$("settings").contains(document.activeElement))) renderSettings();
  const d = current();
  if (state.setupOpen || state.settingsOpen || !d) {
    $("tv").hidden = true; $("bar").hidden = true; $("hint").hidden = true;
    return;
  }
  $("tv").hidden = d.kind !== "tv"; $("bar").hidden = d.kind !== "soundbar";
  $("hint").hidden = d.kind !== "tv" || matchMedia("(pointer: coarse)").matches;
  d.kind === "tv" ? renderTv(d) : renderBar(d);
}

async function refresh() {
  try {
    const s = await api("/api/status");
    state.devices = s.devices; state.quick = s.quick || [];
    if (s.setup && state.setupAuto) { state.setupAuto = false; openSetup(); return; }  // first run: the wizard
    render();
  }
  catch (e) { if (!e.pin) toast(t("no_link", { error: e.message })); }
}

let refreshTimer;
function refreshSoon(ms) { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, ms); }

async function act(fn, okMsg, { refreshAfter = 1200 } = {}) {
  buzz();
  try { await fn(); if (okMsg) toast(okMsg); if (refreshAfter) refreshSoon(refreshAfter); }
  catch (e) { toast(e.message); }
}

// Plain key presses don't change what the page shows, so no status refresh after them.
function sendKey(key) {
  const d = current(); if (!d || d.kind !== "tv") return;
  act(() => api(`/api/tv/${d.id}/key`, { keys: [key] }), null, { refreshAfter: 0 });
}

// Buttons; volume buttons repeat while held.
document.querySelectorAll("[data-key]").forEach((b) => {
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  b.addEventListener("click", () => { if (!b.dataset.repeat) sendKey(b.dataset.key); });
  if (b.dataset.repeat) {
    b.addEventListener("pointerdown", () => { sendKey(b.dataset.key); t1 = setTimeout(() => (t2 = setInterval(() => sendKey(b.dataset.key), 220)), 450); });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
  }
});

$("power").onclick = () => {
  const d = current(); const on = d.online && d.power === "on";
  act(() => api(`/api/tv/${d.id}/power`, { on: !on }).then((r) => toast(POWER[r.result] ? t(POWER[r.result]) : r.result)));
};

$("textForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const d = current(); const text = $("textIn").value;
  if (!d || !text) return;
  act(() => api(`/api/tv/${d.id}/text`, { text, submit: $("textSubmit").checked })
    .then(() => { $("textIn").value = ""; }), t("text.sent"), { refreshAfter: 0 });
});

const barVol = $("barVol");
barVol.addEventListener("input", () => { dragging = true; $("barVolOut").textContent = barVol.value; });
barVol.addEventListener("change", () => {
  dragging = false; const d = current();
  act(() => api(`/api/bar/${d.id}/volume`, { level: Number(barVol.value) }));
});
$("barUp").onclick = () => act(() => api(`/api/bar/${current().id}/volume`, { delta: 2 }));
$("barDown").onclick = () => act(() => api(`/api/bar/${current().id}/volume`, { delta: -2 }));
$("barMute").onclick = () => act(() => api(`/api/bar/${current().id}/mute`, { muted: null }));

const KEYMAP = { ArrowUp: "KEY_UP", ArrowDown: "KEY_DOWN", ArrowLeft: "KEY_LEFT", ArrowRight: "KEY_RIGHT",
  Enter: "KEY_ENTER", Backspace: "KEY_RETURN", Escape: "KEY_RETURN", h: "KEY_HOME", "+": "KEY_VOLUP", "-": "KEY_VOLDOWN", m: "KEY_MUTE" };
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = KEYMAP[e.key]; if (!k) return;
  const d = current(); if (!d || d.kind !== "tv") return;
  e.preventDefault(); sendKey(k);
});

// Presence: tell the server this page is open, and say bye when it closes. When the remote was
// started from the desktop shortcut, the server stops after the last page is closed.
const CLIENT = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
const hello = () => api("/api/hello", { client: CLIENT }).catch(() => {});
hello();
setInterval(hello, 20000); // keeps going in hidden tabs too (browsers slow it to ~1/min, that's fine)
window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon("/api/bye", new Blob([JSON.stringify({ client: CLIENT })], { type: "text/plain" })); } catch (_) {}
});
window.addEventListener("pageshow", (e) => { if (e.persisted) hello(); }); // back from bfcache

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
loadLan();
setInterval(() => { if (!document.hidden && !$("phone").hidden) loadLan(); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
